name: Build & publish server image

on:
  workflow_run:
    workflows: ["Sync with upstream"]
    types: [completed]
    branches: [feature/turboquant-kv-cache]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build CUDA server image and push to Docker Hub
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout latest synced commit
        uses: actions/checkout@v4
        with:
          ref: feature/turboquant-kv-cache
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="llama-cpp-turboquant"
          DATE="$(date -u +%Y%m%d)"
          SHA="${{ github.sha }}"
          echo "latest=${USER}/${REPO}:server-cuda12" >> "$GITHUB_OUTPUT"
          echo "dated=${USER}/${REPO}:server-cuda12-${DATE}" >> "$GITHUB_OUTPUT"
          echo "sha=${USER}/${REPO}:server-cuda12-${SHA::8}" >> "$GITHUB_OUTPUT"
          echo "cache=${USER}/${REPO}:buildcache-server-cuda12" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          push: true
          build-args: |
            CUDA_VERSION=12.8.1
            UBUNTU_VERSION=24.04
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.dated }}
            ${{ steps.tags.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max
          provenance: false
